name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      # unit = jsdom (logic + ARIA); browser = real Chromium via Vitest Browser Mode
      # (real focus, real keyboard, axe colour-contrast).
      - name: Component tests (unit + real browser)
        run: npm test -- --coverage

      - name: Build library and PWA
        run: npm run build

      # publint + Are the Types Wrong: the package resolves for ESM and bundler consumers.
      - name: Check npm package
        run: npm run check:package

      # Playwright on desktop and a phone viewport: booking flow, axe WCAG 2.2 A/AA in light
      # and dark, 320px reflow, keyboard path, offline PWA.
      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/demo/playwright-report

  deploy-demo:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /my-ui-kit/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo/dist
      - id: deployment
        uses: actions/deploy-pages@v4
