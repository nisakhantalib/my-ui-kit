name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs, e.g. after the "Update visual baselines" workflow commits (its token cannot trigger CI).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Standards that are enforced, not just written down (CONTRIBUTING.md, docs/governance.md).
      - name: Lint (typescript-eslint, react-hooks, jsx-a11y)
        run: npm run lint
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Design tokens regenerated, brand contract intact, every contrast pair passes
        run: npm run tokens:check -w @nisakhantalib/my-ui-kit
      # Apps and Web Components consume the library's published types (dist/), as npm users do.
      - name: Build library
        run: npm run build:lib
      - name: Typecheck
        run: npm run typecheck

      # unit = jsdom (logic + ARIA); browser = real Chromium (focus, keyboard, contrast). Coverage floors.
      - name: Component tests (unit + real browser) with coverage
        run: npm test -- --coverage
      - name: Web Components tests (real Chromium)
        run: npm test -w @nisakhantalib/my-ui-kit-elements
      - name: Governance tooling tests (ESLint plugin, codemods, scanner)
        run: npm run test:governance
      - name: No deprecated API in our own apps
        run: node packages/scanner/bin/kit-scan.js apps --fail-on-deprecated

      - name: Build library, Web Components and apps
        run: npm run build
      - name: Check npm package (publint + Are the Types Wrong)
        run: npm run check:package
      - name: Bundle size budgets
        run: npm run size

      - name: Build Storybook
        run: npm run build:storybook
      - name: Accessibility audit of every story (2 brands × light/dark)
        run: npm run test:storybook -w @nisakhantalib/my-ui-kit

      # Desktop + Pixel 7: every page in both themes, Private tier, two markets, strict CSP,
      # 320px reflow, transfer/cards/activity journeys, public site, real URLs.
      - name: End-to-end tests (Orchid Bank)
        run: npm run test:e2e -w bank -- --grep-invert "visual regression"

      - name: Lighthouse budgets (Orchid Bank)
        run: npx -y @lhci/cli@0.15.1 autorun
        working-directory: apps/bank

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            packages/ui/coverage/lcov.info
            apps/bank/lighthouse
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-reports
          path: apps/*/playwright-report
      - uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: packages/ui/storybook-static

  visual:
    name: Visual regression (pinned Linux image)
    runs-on: ubuntu-latest
    # Same image every run, so fonts and rendering are identical to the committed baselines.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @nisakhantalib/my-ui-kit
      - name: Compare screenshots with baselines
        working-directory: apps/bank
        run: |
          if [ -d e2e/__screenshots__ ]; then
            npx playwright test --grep "visual regression"
          else
            echo "::warning::No visual baselines yet. Run the 'Update visual baselines' workflow to create them."
            npx playwright test --grep "visual regression" --update-snapshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diffs
          path: |
            apps/bank/test-results
            apps/bank/e2e/__screenshots__
          if-no-files-found: ignore

  android:
    name: Android app (Capacitor)
    runs-on: ubuntu-latest # has the Android SDK preinstalled
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8 needs JDK 21
          cache: gradle
      - run: npm ci
      - run: npm run build -w @nisakhantalib/my-ui-kit && npm run build -w bank
      - name: Copy web build into the native project
        run: npx cap sync android
        working-directory: apps/bank
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/bank/android
      - uses: actions/upload-artifact@v4
        with:
          name: orchid-bank-debug-apk
          path: apps/bank/android/app/build/outputs/apk/debug/*.apk

  # Cloudflare Workers (static assets): runs once the repository has a CLOUDFLARE_API_TOKEN secret
  # and a CLOUDFLARE_ACCOUNT_ID variable. Until then, deploy from a laptop with `npm run deploy`.
  deploy-cloudflare:
    name: Deploy to Cloudflare
    needs: [verify, visual]
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://orchid-bank.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN || 'workers' }}.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Orchid Bank at the root, the component library's Storybook at /storybook/.
      - run: npm run build:site
      - name: wrangler deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
