name: Release

# Changesets flow, released on GitHub (not the public npm registry):
# 1. Each PR that changes a package adds a changeset (`npm run changeset`).
# 2. On main, this job opens/updates a "Version Packages" PR (bumps versions + CHANGELOG.md).
# 3. Merging that PR tags each new version and creates a GitHub release for it, with the
#    package tarball attached (installable with `npm install <tarball URL>`) and, for the
#    component library, a CycloneDX SBOM.
#
# Moving to a registry later (an internal Artifactory/Nexus, or npm) is a change to the `release`
# script: `changeset publish` instead of `changeset tag`, plus the registry's auth.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # tags, releases and the version bump
  pull-requests: write # open the Version Packages PR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -w @nisakhantalib/my-ui-kit -- --project unit

      - uses: changesets/action@v1
        id: changesets
        with:
          version: npm run version-packages
          publish: npm run release
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The installable tarball for every released package, plus a software bill of materials.
      - name: Attach package tarballs and SBOM to the GitHub releases
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          mkdir -p release
          node -e 'for (const p of JSON.parse(process.env.PUBLISHED)) console.log(`${p.name} ${p.version}`)' |
            while read -r name version; do
              file=$(npm pack -w "$name" --pack-destination release --silent | tail -n 1)
              gh release upload "$name@$version" "release/$file" --clobber
              if [ "$name" = "@nisakhantalib/my-ui-kit" ]; then
                npm sbom --sbom-format cyclonedx --omit dev -w "$name" > release/sbom.cdx.json
                gh release upload "$name@$version" release/sbom.cdx.json --clobber
              fi
            done
