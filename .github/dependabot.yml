version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # The repo root pins TypeScript 6 for typescript-eslint (needs TS < 6.1); workspaces use TS 7.
      # See CONTRIBUTING.md > Code style. Lift this when typescript-eslint supports TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      # One PR per family instead of one per package.
      storybook: { patterns: ['storybook', '@storybook/*'] }
      testing:
        {
          patterns:
            ['vitest', '@vitest/*', '@testing-library/*', 'playwright', '@playwright/*', 'axe-core', '@axe-core/*'],
        }
      lint: { patterns: ['eslint', '@eslint/*', 'eslint-*', 'typescript-eslint', 'prettier'] }
      capacitor: { patterns: ['@capacitor/*'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
