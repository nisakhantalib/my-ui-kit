<text x="72" y="858" font-size="12.5" font-weight="400" fill="#2b2f38" text-anchor="start">Radio cards: whole card is the target; region shown as description, not part of the name.</text>
<circle cx="52" cy="878" r="11" fill="#b45309"/><text x="52" y="882.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="72" y="882" font-size="12.5" font-weight="400" fill="#2b2f38" text-anchor="start">Native date and select: the phone’s own pickers. Side by side from 640px, stacked below.</text>
<circle cx="52" cy="902" r="11" fill="#b45309"/><text x="52" y="906.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="72" y="906" font-size="12.5" font-weight="400" fill="#2b2f38" text-anchor="start">Confirm dialog repeats the key facts; focus starts on Confirm; page behind is inert.</text>
<circle cx="52" cy="926" r="11" fill="#b45309"/><text x="52" y="930.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">7</text>
<text x="72" y="930" font-size="12.5" font-weight="400" fill="#2b2f38" text-anchor="start">Toast with Share (native share sheet in the app). Has an action, so it never times out.</text>
