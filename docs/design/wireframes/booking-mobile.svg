<text x="72" y="810" font-size="12.5" font-weight="400" fill="#2b2f38" text-anchor="start">Hint text sits between label and input, so it is read before typing (aria-describedby).</text>
<circle cx="52" cy="830" r="11" fill="#b45309"/><text x="52" y="834.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="72" y="834" font-size="12.5" font-weight="400" fill="#2b2f38" text-anchor="start">One primary action per step, full 44px height, thumb-reachable.</text>
