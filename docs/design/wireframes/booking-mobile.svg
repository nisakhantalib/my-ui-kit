<title id="t">Booking flow wireframe, phone</title>
<desc id="d">Three phone screens: step 1 details with field errors, step 2 clinic radio cards with date and time, step 3 review with confirm dialog and a success toast. Seven numbered annotations explain the decisions.</desc>
